<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How you work with AI</title>
<!--
THESIS: your AI use read back one sentence at a time. Each panel says one thing in plain words, the numbers in ink and the rest in gray, with the detail folded under More.
OWN-WORLD: near-white ground, soft gray rounded panels, no borders or shadows, one warm red kept for tension and push back. System font.
STORY: you open it weekly, read this week against your usual, where you differ by project and person, then when, what, how you sound and write, and what it cost.
FIRST VIEWPORT: the page name and live status, then the week sentence: messages this week against a usual week, with an arrow when it moved.
-->
<style>
  :root {
    --ground: #FAFAF9; --panel: #EFEFEE; --pill: rgba(17, 17, 16, .06); --pill-hover: rgba(17, 17, 16, .11);
    --ink: #111110; --ink-soft: #62625E; --ink-faint: #85857F; --line: rgba(17, 17, 16, .1);
    --red: #C4462F;
    --r1: rgba(17, 17, 16, .09); --r2: rgba(17, 17, 16, .22); --r3: rgba(17, 17, 16, .45); --r4: rgba(17, 17, 16, .8);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #111110; --panel: #1C1C1B; --pill: rgba(242, 242, 240, .07); --pill-hover: rgba(242, 242, 240, .13);
      --ink: #F2F2F0; --ink-soft: #9C9C97; --ink-faint: #77776F; --line: rgba(242, 242, 240, .1);
      --red: #E0735F;
      --r1: rgba(242, 242, 240, .08); --r2: rgba(242, 242, 240, .2); --r3: rgba(242, 242, 240, .42); --r4: rgba(242, 242, 240, .8);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #111110; --panel: #1C1C1B; --pill: rgba(242, 242, 240, .07); --pill-hover: rgba(242, 242, 240, .13);
    --ink: #F2F2F0; --ink-soft: #9C9C97; --ink-faint: #77776F; --line: rgba(242, 242, 240, .1);
    --red: #E0735F;
    --r1: rgba(242, 242, 240, .08); --r2: rgba(242, 242, 240, .2); --r3: rgba(242, 242, 240, .42); --r4: rgba(242, 242, 240, .8);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--ground); }
  body {
    margin: 0; color: var(--ink); background: var(--ground);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .page { max-width: 760px; margin: 0 auto; padding: 40px 16px 96px; display: flex; flex-direction: column; gap: 16px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 0 8px 8px; }
  .top h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .status { font-size: 14px; color: var(--ink-soft); margin-right: auto; }
  .status .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); margin-right: 6px; vertical-align: 1px; }

  .panel { background: var(--panel); border-radius: 28px; padding: 40px; min-width: 0; }
  .p-head { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
  .p-head h2 { font-size: 17px; font-weight: 500; color: var(--ink-soft); margin: 0; line-height: 1.3; }
  .p-head .pill { margin-left: auto; }
  .p-note { font-size: 15px; line-height: 1.55; color: var(--ink-soft); max-width: 62ch; margin: 0 0 20px; }
  .p-note[hidden] { display: none; }
  .p-note b { color: var(--ink); font-weight: 600; }
  .big { font-size: 44px; line-height: 1.08; letter-spacing: -0.02em; font-weight: 600; color: var(--ink-soft); margin: 0; text-wrap: pretty; }
  .big b { color: var(--ink); font-weight: 600; }
  .sub { font-size: 17px; line-height: 1.45; color: var(--ink-soft); margin: 16px 0 0; max-width: 60ch; }
  .sub b { color: var(--ink); font-weight: 600; }
  .arr { color: var(--ink-faint); font-weight: 500; margin-left: .06em; }
  .arr.bad { color: var(--red); }
  .glance { margin-top: 32px; }

  .info {
    font: 600 11px/1 -apple-system, BlinkMacSystemFont, sans-serif; color: var(--ink-soft); background: transparent;
    width: 18px; height: 18px; border: 1px solid var(--ink-faint); border-radius: 50%; padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; position: relative; flex: none;
  }
  .info::after { content: ""; position: absolute; inset: -13px; }
  .info:hover, .info[aria-expanded="true"] { color: var(--panel); background: var(--ink); border-color: var(--ink); }
  .pill {
    font: inherit; font-size: 14px; color: var(--ink); background: var(--pill); border: 0; border-radius: 999px;
    padding: 8px 14px; min-height: 36px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; white-space: nowrap;
    transition: background-color 160ms cubic-bezier(.2, .8, .2, 1);
  }
  .pill:hover { background: var(--pill-hover); }
  .pill[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
  .pill[disabled] { opacity: .5; cursor: default; }
  .more { margin-top: 28px; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .detail { margin-top: 28px; padding-top: 28px; border-top: 1px solid var(--line); }
  .detail[hidden] { display: none; }
  .panel .detail > * + * { margin-top: 32px; }
  .panel .detail > .d-note + .d-note { margin-top: 12px; }

  /* Glance pieces: short rows, small columns, phrases. */
  .rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .rows li { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) 4.5rem; gap: 16px; align-items: center; font-size: 15px; }
  .rows .rl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rows .rb { height: 6px; border-radius: 3px; background: var(--r1); overflow: hidden; }
  .rows .rb i { display: block; height: 100%; background: var(--ink); border-radius: 3px; }
  .rows .rv { text-align: right; color: var(--ink); }
  .cols { display: flex; align-items: flex-end; gap: 4px; height: 64px; }
  .cols > i, .cols > span { flex: 1; min-width: 0; }
  .cols > i { background: var(--r3); border-radius: 3px; min-height: 2px; }
  .cols > i.hi { background: var(--ink); }
  .cols > i.red { background: var(--red); }
  .cols > span { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: 2px; }
  .cols > span i { display: block; border-radius: 3px; }
  .axis { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-soft); margin-top: 8px; }
  .axis.even span { flex: 1; text-align: center; }
  .lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .lines li { font-size: 17px; line-height: 1.45; color: var(--ink-soft); }
  .lines b { color: var(--ink); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips span { background: var(--pill); border-radius: 999px; padding: 6px 12px; font-size: 15px; }
  .chips b { color: var(--ink); font-weight: 600; margin-left: 6px; }

  /* Detail under More: flat tables and charts. */
  .d-note { font-size: 15px; color: var(--ink-soft); margin: 0; max-width: 62ch; }
  .d-note b { color: var(--ink); font-weight: 600; }
  .d-label { font-size: 14px; color: var(--ink-soft); margin: 0 0 8px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 24px 16px; margin: 0; }
  .stats dt { font-size: 14px; color: var(--ink-soft); }
  .stats dd { margin: 2px 0 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .scroll { overflow-x: auto; }
  table.ruled { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.ruled th { text-align: left; font-weight: 500; font-size: 13px; color: var(--ink-soft); padding: 0 12px 8px 0; }
  table.ruled td { padding: 8px 12px 8px 0; border-top: 1px solid var(--line); vertical-align: middle; }
  table.ruled .num { text-align: right; white-space: nowrap; }
  table.ruled td:first-child { white-space: nowrap; max-width: 14rem; overflow: hidden; text-overflow: ellipsis; }
  table.ruled td.wrap { white-space: normal; max-width: none; }
  table.ruled tr.day td { color: var(--ink-soft); }
  .bar { height: 6px; border-radius: 3px; background: var(--ink); display: block; min-width: 2px; }
  .bar.os, tr.day .bar { background: var(--r3); }
  .fig { font-size: 12px; }
  svg text { fill: var(--ink-soft); }
  .finds { list-style: none; margin: 0; padding: 0; }
  .finds li { display: grid; grid-template-columns: minmax(0, 1fr) 180px; gap: 16px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .finds svg { width: 180px; height: 24px; display: block; }
  .gauges { display: flex; flex-direction: column; }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--ink-soft); margin: 8px 0 0; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; background: var(--pill); padding: 1px 5px; border-radius: 5px; }
  .empty { color: var(--ink-soft); font-size: 17px; max-width: 60ch; }

  .mask { filter: blur(6px); user-select: none; transition: filter 180ms cubic-bezier(.2, .8, .2, 1); }
  body.names .mask { filter: none; user-select: auto; }

  dialog.share { border: 0; border-radius: 28px; background: var(--panel); color: var(--ink); padding: 24px; max-width: min(520px, 94vw); }
  dialog.share::backdrop { background: rgba(17, 17, 16, .5); }
  dialog.share img { width: 100%; height: auto; display: block; border-radius: 16px; }
  dialog.share .row { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  dialog.share label { font-size: 14px; }
  dialog.share h2 { font-size: 17px; margin: 0 0 16px; font-weight: 600; }
  .ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .enter .panel { animation: rise 520ms cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(var(--i, 0) * 40ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .fresh { animation: fresh 700ms cubic-bezier(.16, 1, .3, 1); }
  @keyframes fresh { from { opacity: .25; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .enter .panel, .fresh { animation: none; } .mask, .pill { transition: none; } }

  @media (max-width: 760px) {
    .page { padding: 24px 16px 64px; gap: 12px; }
    .panel { padding: 24px; border-radius: 24px; }
    .big { font-size: 30px; line-height: 1.12; }
    .rows li { grid-template-columns: minmax(0, 6.5rem) minmax(0, 1fr) 4.5rem; gap: 12px; }
    .finds li { grid-template-columns: 1fr; gap: 4px; }
    .two { grid-template-columns: minmax(0, 1fr); }
    .hide-sm, .gauges { display: none; }
    .pill { min-height: 44px; }
  }
</style>
</head>
<body>
<main class="page" id="page">
  <p class="empty">Reading your transcripts...</p>
</main>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const pct = (x) => Math.round((x || 0) * 100) + '%';
  const num = (x) => Math.round(x || 0).toLocaleString();
  const money = (x) => '$' + Math.round(x || 0).toLocaleString();
  const hrs = (m) => (m / 60 >= 10 ? Math.round(m / 60) : (m / 60).toFixed(1)) + 'h';
  const DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const DAY = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const fmtH = (h) => (h % 12 || 12) + (h < 12 ? 'am' : 'pm');
  const narrow = () => window.matchMedia('(max-width: 760px)').matches;
  const shortDate = (d) => new Date(d + 'T00:00:00Z').toLocaleDateString('en', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  let last = null;
  let firstPaint = true;

  // Numbers in a sentence go in ink, the words around them stay gray.
  const NUM = /(\$?\d(?:[\d,]*\d)?(?:\.\d+)?(?:%|x|h)?)/;
  function ink(text) { return String(text).split(NUM).map((p, i) => (i % 2 ? `<b>${esc(p)}</b>` : esc(p))).join(''); }
  function masked(name, isPerson) { return isPerson ? `<span class="mask">${esc(name)}</span>` : esc(name); }
  function inkName(text, name, isPerson) {
    const re = new RegExp('\\b' + String(name).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b');
    return String(text).split(re).map(ink).join(isPerson ? masked(name, true) : `<b>${esc(name)}</b>`);
  }

  // An arrow only when a number moved more than 10% against your usual. Red only when it means more tension.
  function arrow(now, base, badWhenUp, fmt) {
    if (!base || Math.abs(now / base - 1) <= 0.1) return '';
    const up = now > base;
    return `<span class="arr${badWhenUp && up ? ' bad' : ''}" aria-hidden="true">${up ? '↑' : '↓'}</span><span class="sr">, ${up ? 'up' : 'down'}</span>`;
  }

  function ramp(v, max) {
    if (!v) return 'transparent';
    const q = v / (max || 1);
    const steps = [[0.75, 'var(--r4)'], [0.45, 'var(--r3)'], [0.2, 'var(--r2)']];
    const hit = steps.find(([min]) => q > min);
    return hit ? hit[1] : 'var(--r1)';
  }

  function rows(list) {
    const max = Math.max(...list.map((r) => r.v), 1);
    return `<ul class="rows">${list.map((r) => `<li><span class="rl">${r.label}</span><span class="rb" aria-hidden="true"><i style="width:${Math.max(2, (r.v / max) * 100)}%"></i></span><span class="rv">${r.text}</span></li>`).join('')}</ul>`;
  }
  function cols(values, label, cls) {
    const max = Math.max(...values) || 1;
    return `<div class="cols" role="img" aria-label="${esc(label)}">${values.map((v, i) => `<i class="${cls ? cls(v, i) : ''}" style="height:${(v / max) * 100}%"></i>`).join('')}</div>`;
  }

  const METRIC_NAME = { medianWords: 'words per message', correction: 'push back', question: 'questions', laugh: 'laughs', late: 'late-night messages', shout: 'all-caps messages', neg: 'tense messages', pos: 'upbeat messages' };
  function fmtMetric(k, v) { return k === 'medianWords' ? Math.round(v) + ' words' : pct(v); }
  // Filled dot = higher than usual, hollow = lower. Red only when it means more tension.
  function gauge(v, b, metric) {
    const max = Math.max(v, b) * 1.15 || 1;
    const x = (n) => 8 + (n / max) * 164;
    const col = metric === 'neg' && v > b ? 'var(--red)' : 'var(--ink)';
    const name = METRIC_NAME[metric] || String(metric).replace(/^lang:/, '');
    return `<svg viewBox="0 0 180 28" role="img" aria-label="${esc(name)}: ${esc(fmtMetric(metric, v))} here, ${esc(fmtMetric(metric, b))} usually">
      <line x1="8" y1="14" x2="172" y2="14" stroke="var(--r2)" stroke-width="1"/>
      <line x1="${x(b)}" y1="6" x2="${x(b)}" y2="22" stroke="var(--ink-soft)" stroke-width="1.5"/>
      <line x1="${x(Math.min(v, b))}" y1="14" x2="${x(Math.max(v, b))}" y2="14" stroke="${col}" stroke-width="2"/>
      <circle cx="${x(v)}" cy="14" r="4.5" fill="${v > b ? col : 'var(--panel)'}" stroke="${col}" stroke-width="2"/>
    </svg>`;
  }

  // What each panel counts and the rules behind it, matching what the code does.
  const INFO = {
    week: (m) => {
      const y = m.you, w = m.thisWeek || {};
      const tools = [y.byTool.claude ? `${num(y.byTool.claude)} in Claude Code` : '', y.byTool.codex ? `${num(y.byTool.codex)} in Codex` : ''].filter(Boolean).join(' and ');
      return `Messages you typed Monday to today, against your average over the ${w.weeksCompared || 'last few'} full weeks before this one. An arrow shows up when a number moved more than 10%.<br><br>
        <b>Counted:</b> every prompt you typed yourself, ${tools || 'none yet'}. <b>Left out:</b> ${num(m.machine.osPrompts)} messages your automation wrote (scheduled runs, subagents, prompts that open with your OS's own preamble), tool results, command output, and interrupted or empty turns.<br><br>
        Hours add up time inside your sessions, and a gap over 30 minutes counts as a break. The streak counts days in a row with a message; today counts once you send one. Claude Code deletes transcripts after 30 days by default, but inkprint keeps what it already read, so the range keeps growing.`;
    },
    differ: () => `Each line compares your messages on one project, or messages that name one person, with all your messages. A project needs 25 of your messages and a person 12 mentions. A difference only counts when it's at least 1.6 times higher or lower than usual and at least 3 points apart, so 1% against 2% never shows. Projects come from the folder a session ran in; people are matched by name and nickname from your people list.`,
    when: () => `Your messages by weekday and hour, in your timezone. The calendar under More has one square per day, darker for more messages, and a session runs from your first message to your last with any gap over 30 minutes counted as a break.`,
    projects: () => `Time is the active time inside your sessions, split across projects by how many of your messages went to each. Day to day holds your own OS or admin work, if you've marked it in config, plus general sessions that name no project.`,
    mood: () => `Every message you typed is scored on this machine by a small classifier: tense covers frustrated and stressed, upbeat covers pleased and playful, and anything else counts as flat. The general model only calls a message tense or upbeat when it's fairly sure, and tuning swaps it for one trained on your own messages.`,
    voice: () => `Built from messages you sent: the ones your AI read for you in Gmail, Discord, Telegram, WhatsApp, Google Chat or Teams, plus a WhatsApp bridge database if you run one. Messages your AI sent in your name are left out. A person or group gets its own card at 30 messages. The check stops a draft that misses your usual range on two or more measures, or breaks a rule you've told your AI twice.`,
    words: () => `Typical words is the middle length of your messages, so a few long pastes don't pull it up. Push back counts messages that open with things like "no", "wrong" or "again", or say "you missed" or "I said". The phrase lists skip common words, numbers, links, and pasted code or logs.`,
    people: () => `Mentions are your messages that name someone from your people list, by name or nickname. Names stay hidden until you press Show names, and none of this leaves your machine.`,
    cost: () => `Your tokens priced at each model's public per-token rates for input, output, and cache reads and writes, which a subscription isn't billed. Your sessions are ones you started; your automation covers scheduled runs, subagents and sessions it opened. Models with no known price show n/a until you add one under <code>usage.prices</code>.`,
  };
  let openNote = null;
  const openMore = new Set();

  function namesBtn(where) {
    const on = document.body.classList.contains('names');
    return `<button class="pill names-btn" type="button" data-names="${where}" aria-pressed="${on}">${on ? 'Hide names' : 'Show names'}</button>`;
  }

  function panel(m, key, title, b) {
    const note = INFO[key];
    const open = openMore.has(key), noted = openNote === key;
    const parts = [`<div class="p-head"><h2 id="h-${key}">${title}</h2>`];
    if (note) parts.push(`<button class="info" type="button" data-note="${key}" aria-expanded="${noted}" aria-controls="n-${key}" aria-label="What this counts" aria-describedby="h-${key}">i</button>`);
    parts.push((b.tools || '') + '</div>');
    if (note) parts.push(`<p class="p-note" id="n-${key}"${noted ? '' : ' hidden'}>${note(m)}</p>`);
    if (b.big) parts.push(`<p class="big">${b.big}</p>`);
    parts.push(b.sub || '');
    if (b.glance) parts.push(`<div class="glance">${b.glance}</div>`);
    if (b.more) parts.push(`<button class="pill more" type="button" data-more="${key}" aria-expanded="${open}" aria-controls="d-${key}">${open ? 'Less' : 'More'}</button>`, `<div class="detail" id="d-${key}"${open ? '' : ' hidden'}>${b.more}</div>`);
    return `<section class="panel" aria-labelledby="h-${key}">${parts.join('')}</section>`;
  }

  function week(m) {
    const y = m.you, w = m.thisWeek;
    if (!w) return panel(m, 'week', 'Your messages', { big: `<span data-k="week"><b>${num(y.prompts)}</b></span> messages over <b>${y.activeDays}</b> days.` });
    const usual = w.base && w.base.messages ? Math.round(w.base.messages) : 0;
    // The arrow compares your pace so far with a usual full week, so a Tuesday never reads as a drop.
    const pace = w.daysIn ? (w.now.messages / w.daysIn) * 7 : w.now.messages;
    const big = `<span data-k="week"><b>${num(w.now.messages)}</b></span>${arrow(pace, usual, false, num)} messages so far this week${usual ? `, against <b>${num(usual)}</b> in a usual week` : ''}.`;
    const moodShown = m.mood && m.mood.scored;
    const sub = (w.moved || []).filter((x) => !(moodShown && x.metric === 'neg')).slice(0, 2).map((x) => `<p class="sub">${ink(x.text)}</p>`).join('');
    const i0 = y.series.findIndex((d) => d.day === w.start);
    const days = DOW.map((_, i) => { const d = i0 >= 0 ? y.series[i0 + i] : null; return d ? d.prompts : 0; });
    const today = i0 >= 0 ? y.series.length - 1 - i0 : -1;
    const glance = cols(days, 'Messages per day this week', (v, i) => (i === today ? 'hi' : '')) + `<div class="axis even">${DOW.map((d) => `<span>${d}</span>`).join('')}</div>`;
    const more = `<dl class="stats">
      <div><dt>Messages you typed</dt><dd data-k="prompts">${num(y.prompts)}</dd></div>
      <div><dt>Words</dt><dd>${num(y.words)}</dd></div>
      <div><dt>Active days</dt><dd>${y.activeDays}</dd></div>
      <div><dt>Hours in sessions</dt><dd>${num(y.session.hours)}</dd></div>
      <div><dt>Streak</dt><dd>${y.streak.current} days</dd></div>
      <div><dt>Longest streak</dt><dd>${y.streak.longest} days</dd></div>
    </dl>
    <p class="d-note">From ${esc(shortDate(m.range.from))} to ${esc(shortDate(m.range.to))}, in ${esc(m.tz)}. A typical session runs <b>${y.session.medianMinutes} minutes</b> and <b>${y.session.medianPrompts} messages</b>.</p>`;
    return panel(m, 'week', `Week of ${esc(shortDate(w.start))}, ${num(w.today)} today`, { big, sub, glance, more });
  }

  function differ(m) {
    const c = m.contexts.combined || [];
    if (!c.length) return panel(m, 'differ', 'Where you differ', { big: 'Nothing stands out yet.', sub: `<p class="sub">Comparisons start once a project has 25 of your messages or a person comes up 12 times.</p>` });
    const top = c[0];
    const person = (x) => x.kind === 'person';
    const lead = person(top) ? `When ${masked(top.name, true)} comes up, you` : `On <b>${esc(top.name)}</b>, you`;
    // For people, message length mostly tracks pasted text, so lead with how you talk when there's another difference.
    const talk = top.items.filter((i) => i.metric !== 'medianWords');
    const items = person(top) && talk.length ? talk : top.items;
    const big = `${lead} ${ink(items.slice(0, 2).map((i) => i.phrase).join(' and '))}.`;
    const glance = `<ul class="lines">${c.slice(1, 5).map((x) => `<li>${inkName(x.text, x.name, person(x))}</li>`).join('')}</ul>`;
    const base = m.words.base;
    const groups = [['project', 'By project'], ['person', 'By person']].map(([k, label]) => {
      const list = c.filter((x) => x.kind === k).slice(0, 8);
      if (!list.length) return '';
      return `<div><p class="d-label">${label}</p><ul class="finds">${list.map((x) => `<li><span>${inkName(x.text, x.name, k === 'person')}</span><span class="gauges">${x.items.map((i) => gauge(i.value, i.base, i.metric)).join('')}</span></li>`).join('')}</ul></div>`;
    }).join('');
    const more = `<p class="d-note">Usually you write <b>${base.medianWords} words</b>, push back on <b>${pct(base.correction)}</b> and ask a question in <b>${pct(base.question)}</b> of messages, from ${num(base.n)} messages. ${narrow() ? '' : 'The tick is your usual; each dot is one difference, filled when higher and hollow when lower.'}</p>${groups}`;
    return panel(m, 'differ', 'Where you differ most', { big, glance, more, tools: c.some(person) ? namesBtn('differ') : '' });
  }

  function calendar(m) {
    const s = m.you.series;
    if (!s.length) return '';
    const first = new Date(s[0].day + 'T00:00:00Z');
    const off = (first.getUTCDay() + 6) % 7;
    const ncols = Math.ceil((s.length + off) / 7);
    const cell = 14, gap = 3, left = 28, top = 18;
    const max = Math.max(...s.map((d) => d.prompts));
    let out = '';
    let month = '';
    s.forEach((d, i) => {
      const k = i + off, c = Math.floor(k / 7), r = k % 7;
      const x = left + c * (cell + gap), y = top + r * (cell + gap);
      const isToday = i === s.length - 1;
      out += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="3" fill="${d.prompts ? ramp(d.prompts, max) : 'var(--r1)'}" ${isToday ? 'stroke="var(--ink)" stroke-width="1.5"' : ''}><title>${d.day}: ${d.prompts} messages</title></rect>`;
      const mo = d.day.slice(0, 7);
      if (mo !== month && r === 0) { month = mo; out += `<text x="${x}" y="11" class="fig">${new Date(d.day + 'T00:00:00Z').toLocaleString('en', { month: 'short', timeZone: 'UTC' })}</text>`; }
    });
    ['M', '', 'W', '', 'F', '', 'S'].forEach((l, r) => { if (l) out += `<text x="0" y="${top + r * (cell + gap) + 11}" class="fig">${l}</text>`; });
    const w = left + ncols * (cell + gap);
    return `<svg viewBox="0 0 ${w} ${top + 7 * (cell + gap)}" width="${w}" style="max-width:100%;height:auto" role="img" aria-label="Messages per day">${out}</svg>`;
  }

  function hourGrid(m) {
    const step = narrow() ? 2 : 1;
    const g = m.you.hourDow.map((row) => { const out = []; for (let h = 0; h < 24; h += step) out.push(row.slice(h, h + step).reduce((a, b) => a + b, 0)); return out; });
    const max = Math.max(...g.flat());
    const cell = 20, left = 36, top = 4;
    let out = '';
    g.forEach((row, r) => {
      out += `<text x="0" y="${top + r * (cell + 2) + 14}" class="fig">${DOW[r]}</text>`;
      row.forEach((v, i) => { out += `<rect x="${left + i * (cell + 2)}" y="${top + r * (cell + 2)}" width="${cell}" height="${cell}" rx="3" fill="${v ? ramp(v, max) : 'var(--r1)'}"><title>${DOW[r]} ${i * step}:00, ${v} messages</title></rect>`; });
    });
    [0, 6, 12, 18].forEach((h) => { out += `<text x="${left + (h / step) * (cell + 2)}" y="${top + 7 * (cell + 2) + 14}" class="fig">${fmtH(h)}</text>`; });
    const w = left + g[0].length * (cell + 2);
    return `<svg viewBox="0 0 ${w} ${top + 7 * (cell + 2) + 20}" width="${w}" style="max-width:100%;height:auto" role="img" aria-label="Messages by hour and weekday">${out}</svg>`;
  }

  function when(m) {
    const y = m.you, g = y.hourDow;
    const byDow = g.map((r) => r.reduce((a, b) => a + b, 0));
    const byHour = g[0].map((_, h) => g.reduce((a, r) => a + r[h], 0));
    const busyDow = byDow.indexOf(Math.max(...byDow));
    const busyHour = byHour.indexOf(Math.max(...byHour));
    const weekend = (byDow[5] + byDow[6]) / (byDow.reduce((a, b) => a + b, 0) || 1);
    const big = `You're busiest on <b>${DAY[busyDow]}s</b>, in the hour from <b>${fmtH(busyHour)}</b>.`;
    const sub = `<p class="sub"><b>${pct(m.words.base.late)}</b> of your messages go out late at night, between 10pm and 5am.</p>`;
    const glance = cols(byHour, 'Messages by hour of day', (v, i) => (i === busyHour ? 'hi' : '')) + `<div class="axis"><span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>11pm</span></div>`;
    const more = `<p class="d-note"><b>${pct(weekend)}</b> of your messages land on a weekend.</p><div>${calendar(m)}</div><div>${hourGrid(m)}</div>`;
    return panel(m, 'when', 'When you work', { big, sub, glance, more });
  }

  function weekCols(values) {
    const max = Math.max(...values, 1), w = 6, gap = 2, h = 22;
    return `<svg viewBox="0 0 ${values.length * (w + gap)} ${h}" width="${values.length * (w + gap)}" height="${h}" aria-hidden="true">
      ${values.map((v, i) => `<rect x="${i * (w + gap)}" y="${h - Math.max(1, (v / max) * h)}" width="${w}" height="${Math.max(1, (v / max) * h)}" rx="1.5" fill="${v ? 'var(--ink)' : 'var(--r2)'}"/>`).join('')}</svg>`;
  }

  function projects(m) {
    const real = m.projects.filter((x) => x.prompts >= 3 && !x.day).slice(0, 13);
    const day = m.projects.find((x) => x.day);
    const p = day ? real.concat(day) : real;
    if (!p.length) return '';
    const total = m.projects.reduce((a, x) => a + x.minutes, 0) || 1;
    const projTotal = real.reduce((a, x) => a + x.minutes, 0) || 1;
    const top = real[0] || p[0];
    const top3 = real.slice(0, 3).reduce((a, x) => a + x.minutes, 0) / projTotal;
    const big = real.length
      ? `<b>${esc(top.name)}</b> took <b>${pct(top.minutes / projTotal)}</b> of your project time, about <b>${hrs(top.minutes)}</b>.`
      : `Running your day took about <b>${hrs(day.minutes)}</b>.`;
    const bits = [];
    if (real.length > 3) bits.push(`Your top three cover <b>${pct(top3)}</b> of it.`);
    if (real.length && day) bits.push(`Running your day took another <b>${hrs(day.minutes)}</b>.`);
    const sub = bits.length ? `<p class="sub">${bits.join(' ')}</p>` : '';
    const glance = rows(real.slice(0, 5).map((x) => ({ label: esc(x.name), v: x.minutes, text: hrs(x.minutes) })));
    const max = Math.max(...p.map((x) => x.minutes), 1);
    const trs = p.map((x) => `<tr${x.day ? ' class="day"' : ''}><td>${esc(x.name)}</td>
      <td style="width:34%"><span class="bar" style="width:${(x.minutes / max) * 100}%"></span></td>
      <td class="num">${hrs(x.minutes)}</td><td class="num">${num(x.prompts)}</td>
      <td class="num hide-sm">${weekCols(x.weekly.slice(-12))}</td></tr>`).join('');
    const more = `<div class="scroll"><table class="ruled"><thead><tr><th>Project</th><th>Time</th><th class="num">Hours</th><th class="num">Messages</th><th class="num hide-sm">Last 12 weeks</th></tr></thead><tbody>${trs}</tbody></table></div>
      ${day ? `<p class="d-note">Day to day is ${pct(day.minutes / total)} of all your hours.</p>` : ''}`;
    return panel(m, 'projects', 'What you work on', { big, sub, glance, more });
  }

  // Tune state lives outside the render so a live redraw never re-enables a running job.
  let tuneState = 'idle';
  const TUNE_TEXT = { running: 'Tuning, this takes a few minutes. Keep the inkprint window in your terminal open.', done: 'Tuned to your messages, and every message has been scored again with it.', failed: 'Tuning failed. Is your claude or codex CLI signed in?' };

  function mood(m) {
    const t = m.tone;
    if (!m.mood || !m.mood.scored) {
      return panel(m, 'mood', 'How you sound', { big: "Tone isn't set up yet.", sub: `<p class="sub">The mood model that ships with inkprint is missing from this install. Run <code>npx github:jarrheyd/inkprint</code> again to put it back.</p>` });
    }
    const b = m.words.base, w = m.thisWeek;
    const moods = Object.entries(b.moods || {}).sort((a, c) => c[1] - a[1]);
    const big = w && w.now && w.now.neg != null && w.base && w.base.neg
      ? `This week <b>${pct(w.now.neg)}</b>${arrow(w.now.neg, w.base.neg, true, pct)} of your messages read tense, against <b>${pct(w.base.neg)}</b> usually.`
      : `<b>${pct(b.neg)}</b> of your messages read tense and <b>${pct(b.pos)}</b> upbeat.`;
    const tenseProj = Object.entries(m.projectProfiles).filter(([, p]) => p.n >= 25 && p.neg != null).sort((a, c) => c[1].neg - a[1].neg);
    const sub = `<p class="sub">Most of the time you sound <b>${esc(moods[0] ? moods[0][0] : 'flat')}</b>.${tenseProj.length > 1 ? ` You're most tense on <b>${esc(tenseProj[0][0])}</b> and least on <b>${esc(tenseProj[tenseProj.length - 1][0])}</b>.` : ''}</p>`;
    const wk = m.mood.weeks.filter((x) => x.neg + x.flat + x.pos > 0).slice(narrow() ? -10 : -16);
    const share = wk.map((x) => x.neg / (x.neg + x.flat + x.pos));
    const usualNeg = (w && w.base && w.base.neg) || b.neg;
    const glance = cols(share, 'Share of tense messages per week', (v) => (v > usualNeg * 1.1 ? 'red' : '')) + `<div class="axis"><span>${wk[0] ? esc(shortDate(wk[0].start)) : ''}</span><span>tense share per week, red when above usual</span><span>this week</span></div>`;
    const colW = 28, gap = 8, h = 120;
    const bars = wk.map((x, i) => {
      const n = x.neg + x.flat + x.pos, px = i * (colW + gap);
      const hn = (x.neg / n) * h, hp = (x.pos / n) * h, hf = h - hn - hp;
      return `<g><title>${x.week}: ${pct(x.neg / n)} tense, ${pct(x.pos / n)} upbeat, ${n} messages</title>
        <rect x="${px}" y="0" width="${colW}" height="${Math.max(0, hp - 1)}" rx="2" fill="var(--ink)"/>
        <rect x="${px}" y="${hp}" width="${colW}" height="${Math.max(0, hf - 1)}" rx="2" fill="var(--r1)"/>
        <rect x="${px}" y="${hp + hf}" width="${colW}" height="${hn}" rx="2" fill="var(--red)"/>
        <text x="${px}" y="${h + 14}" class="fig">${Number(x.start.slice(8))}</text>${i === 0 || x.start.slice(5, 7) !== wk[i - 1].start.slice(5, 7) ? `<text x="${px}" y="${h + 27}" class="fig">${esc(shortDate(x.start).split(' ')[0])}</text>` : ''}</g>`;
    }).join('');
    const agree = t && t.heldOut ? t.heldOut.polarity.agree : null;
    const mix = moods.map(([k, v]) => `<tr><td>${esc(k)}</td><td style="width:55%"><span class="bar" style="width:${v * 100}%"></span></td><td class="num">${pct(v)}</td></tr>`).join('');
    const tp = tenseProj.slice(0, 8).map(([k, p]) => `<tr><td>${esc(k)}</td><td class="num">${pct(p.neg)}</td><td class="num">${pct(p.pos)}</td><td class="num">${num(p.n)}</td></tr>`).join('');
    const model = m.toneModel === 'yours'
      ? `<p class="d-note">Scored by a classifier trained on ${t ? num(t.labels) : 'a sample'} of your messages${agree != null ? `; it matches the labeling model on tense, flat or upbeat ${pct(agree)} of the time` : ''}. Read it as a trend, not a verdict on any one message.</p>`
      : `<p class="d-note">Scored by a general model, trained on made-up work messages and run on this machine. It knows work chat in general, not how you in particular sound.</p>
         ${window.__SNAPSHOT__ ? '' : `<p class="d-note">Tuning sends a sample of 800 of your messages through your <code>claude</code> or <code>codex</code> CLI to be labeled, about 120k tokens once on your own plan, then trains here. After that, scoring stays on this machine.</p>
         <p class="ctl"><button class="pill" id="tune" type="button" ${tuneState === 'running' || tuneState === 'done' ? 'disabled' : ''}>Tune it to me</button><span class="d-note" id="tune-status" role="status">${TUNE_TEXT[tuneState] || ''}</span></p>`}`;
    const more = `<div><svg viewBox="0 0 ${wk.length * (colW + gap)} ${h + 30}" width="${wk.length * (colW + gap)}" style="max-width:100%;height:auto" role="img" aria-label="Share of tense and upbeat messages per week">${bars}</svg>
      <p class="legend"><span><i class="sw" style="background:var(--ink)"></i>upbeat, on top</span><span><i class="sw" style="background:var(--r1)"></i>flat</span><span><i class="sw" style="background:var(--red)"></i>tense, at the bottom</span><span>one column per week</span></p></div>
      <div class="two"><table class="ruled"><thead><tr><th>Mood mix</th><th><span class="sr">Share bar</span></th><th class="num">Share</th></tr></thead><tbody>${mix}</tbody></table>
      <div class="scroll"><table class="ruled"><thead><tr><th>Project</th><th class="num">Tense</th><th class="num">Upbeat</th><th class="num">Messages</th></tr></thead><tbody>${tp}</tbody></table></div></div>
      ${model}`;
    return panel(m, 'mood', 'How you sound', { big, sub, glance, more });
  }

  const CH = { ai: 'To your AI', whatsapp: 'WhatsApp', telegram: 'Telegram', discord: 'Discord', email: 'Email', gchat: 'Google Chat', teams: 'Teams', slack: 'Slack' };

  function voice(m) {
    const v = m.voice || { cards: [], rules: [] };
    if (!v.cards.length) return panel(m, 'voice', 'How you write', { big: 'No voice cards yet.', sub: `<p class="sub">Cards build from how you write to your AI, and from your own messages whenever your AI reads a chat or inbox for you, so they fill in as you work.</p>` });
    const byNeed = (a, b) => (b.base - a.base) || (!!a.to - !!b.to) || b.sends - a.sends;
    const all = v.cards.slice().sort(byNeed);
    const people = all.filter((c) => c.to && !/^\d+$/.test(c.to)); // a bare number is a chat we couldn't name
    const chan = all.filter((c) => !c.to).sort((a, b) => b.base - a.base || b.words - a.words);
    const places = chan.filter((c) => !c.base);
    const shortest = places.slice().sort((a, b) => a.words - b.words)[0];
    const longest = places.slice().sort((a, b) => b.words - a.words)[0];
    const r = v.rules[0];
    const spread = shortest && longest && shortest !== longest
      ? `You write shortest on <b>${esc(CH[shortest.channel] || shortest.channel)}</b>, ${ink(shortest.words + ' words')}, and longest on <b>${esc(CH[longest.channel] || longest.channel)}</b>, ${ink(longest.words + ' words')}.` : '';
    const base = chan.find((c) => c.base) || chan[0];
    const big = r ? `You've told your AI "<b>${esc(r.label)}</b>" ${ink(r.count + ' times')}.` : spread || `You write about <b>${base.words}</b> words to your AI.`;
    const sub = r ? `${v.rules.length > 1 ? `<p class="sub">Also ${v.rules.slice(1).map((x) => `"${esc(x.label)}" ${ink(x.count + ' times')}`).join(', ')}, and drafts that break these get stopped.</p>` : ''}${spread ? `<p class="sub">${spread}</p>` : ''}` : '';
    const glance = rows(chan.map((c) => ({ label: esc(c.base ? 'To your AI' : CH[c.channel] || c.channel), v: c.words, text: `${c.words} words` })));
    const cards = chan.concat(people.slice(0, 5));
    const extra = people.length - 5;
    const trs = cards.map((c) => `<tr>
      <td>${c.base ? 'To your AI' : esc(CH[c.channel] || c.channel)}${c.to ? `, ${c.group ? 'in' : 'to'} ${masked(c.to, true)}` : ''}</td>
      <td class="num">${num(c.sends)}</td><td class="num">${c.words}</td>
      <td class="num hide-sm">${c.base || c.channel === 'email' ? '' : pct(c.split)}</td>
      <td class="num hide-sm">${pct(c.greeting)}</td><td class="num">${pct(c.lower)}</td></tr>`).join('') + (extra > 0 ? `<tr><td colspan="6" class="d-note wrap">and ${extra} more people and groups with their own card</td></tr>` : '');
    const more = `<div class="scroll"><table class="ruled"><thead><tr><th>Where</th><th class="num">Messages</th><th class="num">Typical words</th><th class="num hide-sm">Split into several</th><th class="num hide-sm">Greets</th><th class="num">Lowercase</th></tr></thead><tbody>${trs}</tbody></table></div>
      <p class="d-note">Every draft your AI writes for you is checked against the card for that channel and person.</p>`;
    return panel(m, 'voice', 'How you write', { big, sub, glance, more });
  }

  function words(m) {
    const w = m.words, b = w.base;
    const big = `Your typical message is <b>${b.medianWords}</b> words, and <b>${pct(b.lower)}</b> are all lowercase.`;
    const sub = `<p class="sub">When you push back you keep it to about <b>${w.correctionMedianWords}</b> words, and that's <b>${pct(b.correction)}</b> of your messages.</p>`;
    const glance = `<div class="chips">${w.bigrams.slice(0, 10).map(([k, v]) => `<span>${esc(k)}<b>${v}</b></span>`).join('')}</div>`;
    const phrases = w.bigrams.slice(0, 16).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${v}</td></tr>`).join('');
    const single = w.top.slice(0, 16).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num">${v}</td></tr>`).join('');
    const hasTone = Object.values(w.timeProfiles).some((p) => p.neg != null);
    const tp = Object.entries(w.timeProfiles).map(([k, p]) => `<tr><td>${esc(k)}</td><td class="num">${num(p.n)}</td><td class="num">${p.medianWords}</td><td class="num">${pct(p.correction)}</td><td class="num">${pct(p.question)}</td>${hasTone ? `<td class="num">${p.neg != null ? pct(p.neg) : ''}</td>` : ''}</tr>`).join('');
    const parts = w.particles.length ? `<p class="d-note">Filler words you use: ${w.particles.slice(0, 8).map(([k, v]) => `<b>${esc(k)}</b> ${v}`).join(', ')}.</p>` : '';
    const more = `<p class="d-note">The average is ${Math.round(b.avgWords)} words, pulled up by pasted text. You laugh in ${pct(b.laugh)} of your messages.</p>${parts}
      <div class="two"><table class="ruled"><thead><tr><th>Phrases</th><th class="num">Times</th></tr></thead><tbody>${phrases}</tbody></table>
      <table class="ruled"><thead><tr><th>Words</th><th class="num">Times</th></tr></thead><tbody>${single}</tbody></table></div>
      <div class="scroll"><table class="ruled"><thead><tr><th>Time of day</th><th class="num">Messages</th><th class="num">Typical words</th><th class="num">Push back</th><th class="num">Questions</th>${hasTone ? '<th class="num">Tense</th>' : ''}</tr></thead><tbody>${tp}</tbody></table></div>`;
    return panel(m, 'words', 'The words you use', { big, sub, glance, more });
  }

  function people(m) {
    const p = m.people.filter((x) => x.mentions >= 3).slice(0, 16);
    if (!p.length) return panel(m, 'people', 'Who comes up', { big: 'No one from your people file comes up yet.', sub: `<p class="sub">Names come from <code>People/people.md</code> and <code>usage.aliases</code> in your config.</p>` });
    const big = `${masked(p[0].name, true)} comes up most, in <b>${p[0].mentions}</b> of your messages.`;
    const glance = rows(p.slice(0, 5).map((x) => ({ label: masked(x.name, true), v: x.mentions, text: String(x.mentions) })));
    const hasTone = p.some((x) => x.profile.neg != null);
    const trs = p.map((x) => `<tr><td>${masked(x.name, true)}</td><td class="num">${x.mentions}</td>
      <td class="num hide-sm">${weekCols(x.weekly.slice(-12))}</td>
      ${hasTone ? `<td class="num">${x.profile.neg != null ? pct(x.profile.neg) : ''}</td>` : ''}<td class="num">${Math.round(x.profile.medianWords)}</td>
      <td class="hide-sm">${x.projects.map(([k]) => esc(k)).join(', ')}</td></tr>`).join('');
    const more = `<div class="scroll"><table class="ruled"><thead><tr><th>Person</th><th class="num">Mentions</th><th class="num hide-sm">Last 12 weeks</th>${hasTone ? '<th class="num">Tense</th>' : ''}<th class="num">Typical words</th><th class="hide-sm">Mostly on</th></tr></thead><tbody>${trs}</tbody></table></div>`;
    return panel(m, 'people', 'Who comes up', { big, glance, more, tools: namesBtn('people') });
  }

  function cost(m) {
    const k = m.machine;
    const total = k.layers.you.cost + k.layers.os.cost || 1;
    const big = `Your sessions would have cost <b>${money(k.layers.you.cost)}</b>, and your automation <b>${money(k.layers.os.cost)}</b>.`;
    const sub = `<p class="sub">That's at API prices, which a subscription isn't billed. Your OS ran <b>${num(k.osSessions)}</b> sessions on its own, which is <b>${pct(k.layers.os.cost / total)}</b> of the cost.</p>`;
    const days = k.costDaily.slice(narrow() ? -30 : -60);
    const max = Math.max(...days.map((d) => d.you + d.os), 1);
    const glance = `<div class="cols" role="img" aria-label="API-equivalent cost per day, your sessions and your OS">${days.map((d) => `<span title="${d.day}: you ${money(d.you)}, OS ${money(d.os)}"><i style="height:${(d.os / max) * 100}%;background:var(--r3)"></i><i style="height:${(d.you / max) * 100}%;background:var(--ink)"></i></span>`).join('')}</div>
      <div class="axis"><span>last ${days.length} days</span><span><i class="sw" style="background:var(--ink)"></i>you <i class="sw" style="background:var(--r3);margin-left:10px"></i>your OS</span><span>peak ${money(max)}</span></div>`;
    const models = k.models.slice(0, 8).map((x) => `<tr><td>${esc(x.model)}</td><td class="num">${num(x.calls)}</td><td class="num">${x.out >= 1e6 ? (x.out / 1e6).toFixed(1) + 'M' : Math.round(x.out / 1e3) + 'K'}</td><td class="num">${x.priced ? money(x.cost) : 'n/a'}</td></tr>`).join('');
    const toolsMax = Math.max(...k.tools.you.concat(k.tools.os).map((t) => t[1]), 1);
    const tools = (list, cls) => list.slice(0, 10).map(([n, v]) => `<tr><td>${esc(n.replace(/^mcp__.*__/, ''))}</td><td class="hide-sm" style="width:40%"><span class="bar ${cls}" style="width:${(v / toolsMax) * 100}%"></span></td><td class="num">${num(v)}</td></tr>`).join('');
    const more = `<div class="scroll"><table class="ruled"><thead><tr><th>Model</th><th class="num">Calls</th><th class="num">Output</th><th class="num">API-equivalent</th></tr></thead><tbody>${models}</tbody></table></div>
      <div class="two"><div class="scroll"><table class="ruled"><thead><tr><th>Tools in your sessions</th><th class="hide-sm"><span class="sr">Bar</span></th><th class="num">Calls</th></tr></thead><tbody>${tools(k.tools.you, '')}</tbody></table></div>
      <div class="scroll"><table class="ruled"><thead><tr><th>Tools your OS used</th><th class="hide-sm"><span class="sr">Bar</span></th><th class="num">Calls</th></tr></thead><tbody>${tools(k.tools.os, 'os')}</tbody></table></div></div>
      ${k.unpricedTokens ? `<p class="d-note">${num(k.unpricedTokens)} tokens are on models with no price set; add them under <code>usage.prices</code>.</p>` : ''}`;
    return panel(m, 'cost', 'What it costs', { big, sub, glance, more });
  }

  // The share card: drawn here, saved here, nothing uploaded. Names are swapped out unless you keep them.
  function shareCard(m, keepNames) {
    const W = 1080, H = 1350, c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    // The card always uses the light colors, whatever theme the page is in.
    const GROUND = '#FAFAF9', PANEL = '#EFEFEE', INK = '#111110', SOFT = '#62625E';
    g.fillStyle = GROUND; g.fillRect(0, 0, W, H);
    g.fillStyle = PANEL; g.beginPath(); g.roundRect(48, 48, W - 96, H - 96, 56); g.fill();
    const font = (px) => `600 ${px}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
    const X = 120, MAXW = W - 240;
    // Writes a sentence word by word: words with a number in ink, the rest gray, wrapping at MAXW.
    const rich = (t, y, px, lead) => {
      g.font = font(px);
      const space = g.measureText(' ').width;
      let x = X;
      for (const wd of String(t).split(' ')) {
        const wdW = g.measureText(wd).width;
        if (x > X && x + wdW > X + MAXW) { x = X; y += px * lead; }
        // Only the number itself goes in ink; brackets and commas around it stay gray.
        const [, pre, core, post] = wd.match(/^(\W*)(.*?)([^\w%$]*)$/);
        let cx = x;
        for (const [part, col] of [[pre, SOFT], [core, /\d/.test(core) ? INK : SOFT], [post, SOFT]]) {
          if (!part) continue;
          g.fillStyle = col; g.fillText(part, cx, y); cx += g.measureText(part).width;
        }
        x += wdW + space;
      }
      return y + px * lead;
    };
    const w = m.thisWeek || { now: {}, base: {} };
    const alias = new Map(); let n = 0;
    const hide = (name) => {
      if (keepNames) return name;
      if (!alias.has(name)) alias.set(name, 'Project ' + String.fromCharCode(65 + n++));
      return alias.get(name);
    };
    g.font = font(34); g.fillStyle = SOFT; g.fillText(`My week with AI, from ${shortDate(w.start || m.range.to)}`, X, 190);
    const usual = w.base && w.base.messages ? Math.round(w.base.messages) : 0;
    let y = rich(`${num(w.now.messages || 0)} messages this week${usual ? `, against ${num(usual)} in a usual week.` : '.'}`, 300, 84, 1.08);
    y = rich(`A ${m.you.streak.current} day streak, and ${m.words.base.medianWords} words in a typical message.`, y + 40, 44, 1.2);
    // The card speaks as you: the page's "you" lines turned into "I".
    const mine = (t) => String(t).replace(/\bYou're\b/g, "I'm").replace(/\byou're\b/g, "I'm").replace(/\b[Yy]ou\b/g, 'I').replace(/\byour\b/g, 'my').replace(/\bYour\b/g, 'My');
    // A mix: one thing that moved this week, one project, one person, then your top rule.
    const tells = [];
    for (const x of (w.moved || []).slice(0, 1)) tells.push(mine(x.text));
    const comb = m.contexts.combined || [];
    for (const d of comb.filter((x) => x.kind === 'project').slice(0, 1)) tells.push(mine(d.text.split(d.name).join(hide(d.name))));
    // For people, message length mostly tracks pasted text, so pick a difference in how you talk instead.
    const person = comb.find((x) => x.kind === 'person' && x.items.some((i) => i.metric !== 'medianWords'));
    if (person) {
      const i = person.items.find((x) => x.metric !== 'medianWords');
      if (i && i.phrase) tells.push(`${keepNames ? `When ${person.name} comes up, I` : 'When a certain teammate comes up, I'} ${i.phrase}.`);
    }
    if (m.voice && m.voice.rules && m.voice.rules[0]) tells.push(`My most repeated note to my AI: "${m.voice.rules[0].label}", ${m.voice.rules[0].count} times.`);
    y += 40;
    for (const t of tells.filter(Boolean).slice(0, 4)) { if (y > H - 200) break; y = rich(t, y, 34, 1.3) + 20; }
    g.font = font(26); g.fillStyle = SOFT; g.fillText('made with inkprint, on my machine', X, H - 120);
    c.lines = [`${num(w.now.messages || 0)} messages this week.`].concat(tells.slice(0, 4));
    return c;
  }

  function openShare(m) {
    let d = document.getElementById('share-dialog');
    if (!d) {
      d = document.createElement('dialog'); d.id = 'share-dialog'; d.className = 'share'; d.setAttribute('aria-labelledby', 'share-title');
      d.innerHTML = `<h2 id="share-title">Your week as an image</h2><img alt="Your week with AI, as an image" width="1080" height="1350" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="><div class="row"><label><input type="checkbox" id="share-names"> Show real project and people names</label>
        <span class="ctl"><button class="pill" id="share-close" type="button">Close</button><a class="pill" id="share-save" download="my-week-with-ai.png">Save image</a></span></div>`;
      document.body.appendChild(d);
      d.querySelector('#share-close').addEventListener('click', () => d.close());
      d.querySelector('#share-names').addEventListener('change', () => drawShare(d));
      d.addEventListener('close', () => { if ($('#share')) $('#share').focus(); });
    }
    d._m = m; // the toggle always redraws the latest numbers, not the ones from the first open
    drawShare(d);
    d.showModal();
  }
  function drawShare(d) {
    const c = shareCard(d._m, d.querySelector('#share-names').checked);
    const url = c.toDataURL('image/png');
    const img = d.querySelector('img');
    img.src = url; img.alt = c.lines.join(' ');
    d.querySelector('#share-save').href = url;
  }

  function render(m, force) {
    if (!m || !m.you || !m.you.prompts) {
      $('#page').innerHTML = `<p class="empty">No messages found yet. This page reads Claude Code transcripts from <code>~/.claude/projects</code> and Codex sessions from <code>~/.codex/sessions</code>. Use either tool, then reload.</p>`;
      return;
    }
    const status = () => { $('#status').innerHTML = window.__SNAPSHOT__ ? `Snapshot from ${new Date(m.generated).toLocaleString()}` : `<span class="dot" aria-hidden="true"></span>Live, updated ${new Date(m.generated).toLocaleTimeString()}`; };
    // Live updates only redraw when something you can see changed; focus stays where it was.
    const sig = (x) => JSON.stringify([x.you.prompts, x.you.words, x.machine.layers, x.mood && x.mood.scored, x.toneModel, x.voice && x.voice.cards.length, narrow()]);
    if (last && force !== true && sig(last) === sig(m)) { last = m; status(); return; }
    const before = last && last.you.prompts;
    const a = document.activeElement;
    // Remember what had focus by id or data key, so a redraw can hand it back.
    const key = a && a.dataset && ['more', 'note', 'names'].find((k) => a.dataset[k]);
    const focusSel = a && a.id ? '#' + a.id : key ? `[data-${key}="${a.dataset[key]}"]` : null;
    const top = `<header class="top"><h1>How you work with AI</h1><span class="status" id="status"></span>${window.__SNAPSHOT__ ? '' : '<button class="pill" id="share" type="button">Share your week</button>'}</header>`;
    const panels = [week(m), differ(m), when(m), projects(m), mood(m), voice(m), words(m), people(m), cost(m)].filter(Boolean);
    $('#page').innerHTML = top + panels.join('');
    document.querySelectorAll('.panel').forEach((p, i) => p.style.setProperty('--i', i));
    $('#page').classList.toggle('enter', firstPaint);
    firstPaint = false;
    if (before != null && before !== m.you.prompts) document.querySelectorAll('[data-k]').forEach((n) => n.classList.add('fresh'));
    last = m;
    status();
    document.querySelectorAll('.names-btn').forEach((btn) => btn.addEventListener('click', () => {
      const on = document.body.classList.toggle('names');
      document.querySelectorAll('.names-btn').forEach((x) => { x.setAttribute('aria-pressed', String(on)); x.textContent = on ? 'Hide names' : 'Show names'; });
    }));
    if ($('#share')) $('#share').addEventListener('click', () => openShare(last));
    document.querySelectorAll('.info[data-note]').forEach((b) => b.addEventListener('click', () => {
      openNote = openNote === b.dataset.note ? null : b.dataset.note;
      document.querySelectorAll('.info[data-note]').forEach((x) => {
        const open = x.dataset.note === openNote;
        x.setAttribute('aria-expanded', String(open));
        document.getElementById('n-' + x.dataset.note).hidden = !open;
      });
    }));
    document.querySelectorAll('.more[data-more]').forEach((b) => b.addEventListener('click', () => {
      const k = b.dataset.more, open = !openMore.has(k);
      if (open) openMore.add(k); else openMore.delete(k);
      b.setAttribute('aria-expanded', String(open));
      b.textContent = open ? 'Less' : 'More';
      document.getElementById('d-' + k).hidden = !open;
    }));
    if ($('#tune')) $('#tune').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      try {
        const res = await fetch('/api/tune', { method: 'POST' });
        if (!res.ok && res.status !== 409) throw new Error(String(res.status));
        tuneState = 'running';
      } catch { tuneState = 'failed'; btn.disabled = false; }
      $('#tune-status').textContent = tuneState === 'failed' ? "Couldn't start tuning; is the inkprint window in your terminal still open?" : TUNE_TEXT.running;
    });
    if (focusSel && $(focusSel)) $(focusSel).focus({ preventScroll: true });
  }

  async function load() {
    try {
      const m = window.__SNAPSHOT__ || await (await fetch('/api/metrics', { cache: 'no-store' })).json();
      render(m);
    } catch (e) {
      $('#page').innerHTML = `<p class="empty">Couldn't read the metrics (${esc(e.message)}). Is <code>node serve.js</code> still running?</p>`;
    }
  }

  load();
  if (!window.__SNAPSHOT__ && window.EventSource) {
    const es = new EventSource('/api/stream');
    es.addEventListener('update', load);
    es.onerror = () => { if ($('#status')) $('#status').textContent = 'Offline, retrying'; };
    es.addEventListener('tune', (e) => {
      tuneState = JSON.parse(e.data).state;
      if ($('#tune-status')) $('#tune-status').textContent = TUNE_TEXT[tuneState] || '';
      if ($('#tune')) $('#tune').disabled = tuneState !== 'failed' && tuneState !== 'idle';
      if (tuneState === 'done') load();
    });
  }
  let rt;
  let wasNarrow = narrow();
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (last && narrow() !== wasNarrow) { wasNarrow = narrow(); render(last, true); } }, 200); });
})();
</script>
</body>
</html>
